    <script>
      (function () {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch;
            },
            set: function (fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // ignore if already non-configurable
        }
      })();
    </script>
